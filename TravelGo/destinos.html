<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Descubrí destinos de América, Europa y Asia con TravelGo">
    <meta name="keywords" content="viajes, destinos, itinerarios, turismo, TravelGo">
    <meta name="author" content="Guillermo Pernichi, Joaquín Peyronel">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelGo - Destinos</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body onload="iniciarDestinos()">
    <header>
        <h1>TravelGo</h1>
        <p>Viajá · Descubrí · Viví</p>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="destinos.html">Destinos</a>
            <a href="itinerarios.html">Itinerarios</a>
            <a href="cotizacion.html">Cotización</a>
            <a href="nosotros.html">Sobre nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>
    <main>
        <section class="encabezado-pagina">
            <h2>Explorá nuestros destinos</h2>
            <p>Elegí una región y descubrí lugares increíbles para tu próximo viaje.</p>
        </section>
        <section class="filtros-destinos">

            <div class="buscador-destinos">
                <label for="buscarDestino">Buscar destino</label>
                <input type="text" id="buscarDestino" placeholder="Ej: Italia, Japón, Argentina..."
                    onkeyup="buscarDestinos()">
            </div>

            <div class="continentes-destinos">
                <button type="button" id="btnTodos" onclick="filtrarPorContinente('Todos')">Todos</button>
                <button type="button" id="btnAmerica" onclick="filtrarPorContinente('América')">América</button>
                <button type="button" id="btnEuropa" onclick="filtrarPorContinente('Europa')">Europa</button>
                <button type="button" id="btnAsia" onclick="filtrarPorContinente('Asia')">Asia</button>
                <button type="button" id="btnAfrica" onclick="filtrarPorContinente('África')">África</button>
                <button type="button" id="btnOceania" onclick="filtrarPorContinente('Oceanía')">Oceanía</button>
            </div>

            <div class="orden-destinos">
                <label for="ordenDestinos">Ordenar por:</label>

                <select id="ordenDestinos" onchange="ordenarDestinos()">
                    <option value="az">A - Z</option>
                    <option value="za">Z - A</option>
                </select>
            </div>

        </section>

        <div id="listaDestinos" class="contenedor-destinos"></div>
        <section>
            <h2>Destinos disponibles</h2>

            <div id="listaDestinos" class="contenedor-destinos">
            </div>
        </section>
    </main>
    <footer>
        <p>TravelGo - Viajá · Descubrí · Viví</p>
        <p>&copy; 2026 TravelGo</p>
    </footer>
    <script src="js/funciones.js"></script>
</body>

</html>
