<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="description" content="Itinerarios de viaje recomendados por TravelGo">

    <meta name="keywords" content="viajes, itinerarios, turismo, destinos, TravelGo">

    <meta name="author" content="Guillermo Pernichi, Joaquín Peyronel">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Itinerarios | TravelGo</title>
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body onload="iniciarItinerarios()">

    <header>

        <div class="marca">
            <h1>TravelGo</h1>
            <p>Viajá · Descubrí · Viví</p>
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="destinos.html">Destinos</a>
            <a href="itinerarios.html">Itinerarios</a>
            <a href="cotizacion.html">Cotización</a>
            <a href="nosotros.html">Sobre nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>

    </header>

    <main>

        <section class="presentacion-pagina">

            <h2>Itinerarios</h2>

            <p>
                Encontrá el recorrido ideal para tu próximo viaje.
            </p>

        </section>

        <section class="filtros-itinerarios">

            <div class="buscador-itinerarios">

                <label for="buscarItinerario">
                    Buscar itinerario
                </label>

                <input type="text" id="buscarItinerario" placeholder="Ej: Japón, Italia clásica, Caribe..." size="40"
                    maxlength="50" onkeyup="filtrarItinerarios()">

            </div>

            <div class="opciones-filtros-itinerarios">

                <div class="filtro-itinerario">

                    <label for="destinoItinerario">
                        Destino
                    </label>

                    <select id="destinoItinerario" onchange="filtrarItinerarios()">
                        <option value="Todos">
                            Todos los destinos
                        </option>
                    </select>

                </div>

                <div class="filtro-itinerario">

                    <label for="duracionItinerario">
                        Duración
                    </label>

                    <select id="duracionItinerario" onchange="filtrarItinerarios()">
                        <option value="Todos">
                            Todas
                        </option>

                        <option value="corto">
                            Hasta 5 días
                        </option>

                        <option value="medio">
                            De 6 a 10 días
                        </option>

                        <option value="largo">
                            Más de 10 días
                        </option>
                    </select>

                </div>

                <div class="filtro-itinerario">

                    <label for="ordenItinerario">
                        Ordenar por
                    </label>

                    <select id="ordenItinerario" onchange="filtrarItinerarios()">
                        <option value="az">
                            A - Z
                        </option>
                        <option value="za">
                            Z - A
                        </option>

                        <option value="diasMenor">
                            Menor duración
                        </option>

                        <option value="diasMayor">
                            Mayor duración
                        </option>
                    </select>

                </div>

            </div>

        </section>

        <section id="listaItinerarios" class="contenedor-itinerarios">
        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 TravelGo - Guillermo Pernichi y Joaquín Peyronel
        </p>
    </footer>

    <script src="js/funciones.js"></script>

</body>

</html>
